<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="faq-container">
    <h1>Frequently Asked Questions</h1>

    <div class="faq-item">
        <button class="faq-question">
            What is HTML?
            <span>+</span>
        </button>
        <div class="faq-answer">
            <p>HTML is used to structure content on a webpage.</p>
        </div>
    </div>

    <div class="faq-item">
        <button class="faq-question">
            What is CSS?
            <span>+</span>
        </button>
        <div class="faq-answer">
            <p>CSS is used to style and design webpages.</p>
        </div>
    </div>

    <div class="faq-item">
        <button class="faq-question">
            What is JavaScript?
            <span>+</span>
        </button>
        <div class="faq-answer">
            <p>JavaScript makes webpages interactive and dynamic.</p>
        </div>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
